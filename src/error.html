<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>iCloud</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      color: #1d1d1f;
      font: 14px/1.6 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-user-select: none;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #f5f5f7; }
      .detail { color: #98989d !important; }
      .box { background: #2c2c2e !important; box-shadow: 0 10px 40px rgba(0,0,0,.5) !important; }
    }
    .box {
      background: #fff;
      border-radius: 14px;
      padding: 34px 40px 30px;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .1);
    }
    h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
    p { margin: 0 0 6px; }
    .detail { color: #6e6e73; font-size: 12.5px; }
    a.retry {
      display: inline-block;
      margin-top: 20px;
      background: #0a84ff;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 26px;
      border-radius: 9px;
    }
    a.retry:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="box">
    <h1>无法连接到 iCloud</h1>
    <p>请检查网络连接，或稍后重试。</p>
    <p class="detail" id="detail"></p>
    <a class="retry" href="https://www.icloud.com.cn/">重新加载</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var code = params.get('code');
      var desc = params.get('desc');
      var host = params.get('url') || '';
      var parts = [];
      if (code) parts.push('错误代码 ' + code);
      if (desc) parts.push(desc);
      if (host) parts.push(host.slice(0, 80));
      document.getElementById('detail').textContent = parts.join(' · ');
    })();
  </script>
</body>
</html>
