<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>iCloud 桌面版设置</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, .08);
      --accent: #0a84ff;
      --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --card: #2c2c2e;
        --text: #f5f5f7;
        --muted: #98989d;
        --line: rgba(255, 255, 255, .1);
        --shadow: 0 1px 2px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    header {
      padding: 20px 24px 12px;
    }
    header h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: .2px;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 4px 24px 8px;
    }
    section { margin-bottom: 18px; }
    h2 {
      margin: 0 0 7px 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
    }
    .card {
      background: var(--card);
      border-radius: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card + .card { margin-top: 10px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 14px;
      border-top: 1px solid var(--line);
    }
    .row:first-child { border-top: none; }
    .row .label { min-width: 0; }
    .row .label span { display: block; }
    .row .label small {
      display: block;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 2px;
    }
    select, button, input[type="range"] { font: inherit; color: inherit; }
    select {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
      min-width: 148px;
    }
    input[type="range"] {
      width: 132px;
      accent-color: var(--accent);
    }
    button {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 5px 13px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
      padding: 6px 22px;
    }
    button.primary:hover { filter: brightness(1.08); }
    .switch {
      appearance: none;
      width: 38px;
      height: 22px;
      border-radius: 11px;
      background: rgba(120, 120, 128, .32);
      position: relative;
      cursor: pointer;
      flex: none;
      transition: background .15s ease;
      margin: 0;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
      transition: transform .15s ease;
    }
    .switch:checked { background: #34c759; }
    .switch:checked::after { transform: translateX(16px); }
    footer {
      padding: 10px 24px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 11.5px;
    }
    .status { min-height: 15px; }
  </style>
</head>
<body>
  <header>
    <h1>iCloud 桌面版</h1>
    <p id="meta">正在读取版本信息…</p>
  </header>

  <main>
    <section>
      <h2>启动</h2>
      <div class="card">
        <label class="row">
          <div class="label">
            <span>启动时打开</span>
            <small>决定应用启动后显示哪个页面</small>
          </div>
          <select id="startPage">
            <option value="last">上次使用的页面</option>
            <option value="home">iCloud 首页</option>
          </select>
        </label>
        <label class="row">
          <div class="label">
            <span>登录时自动启动</span>
            <small>登录 Windows 后自动打开 iCloud</small>
          </div>
          <input class="switch" type="checkbox" id="launchAtLogin" />
        </label>
      </div>
    </section>

    <section>
      <h2>窗口</h2>
      <div class="card">
        <label class="row">
          <div class="label">
            <span>关闭窗口时保留在托盘</span>
            <small>继续后台同步，并保持通知可用</small>
          </div>
          <input class="switch" type="checkbox" id="closeToTray" />
        </label>
        <div class="row">
          <div class="label">
            <span>页面缩放</span>
            <small id="zoomLabel">100%</small>
          </div>
          <input type="range" id="zoom" min="50" max="250" step="5" />
        </div>
      </div>
    </section>

    <section>
      <h2>通知</h2>
      <div class="card">
        <label class="row">
          <div class="label">
            <span>允许网页通知</span>
            <small>邮件、提醒事项、共享相簿等到达时提醒</small>
          </div>
          <input class="switch" type="checkbox" id="notifications" />
        </label>
      </div>
      <div class="card">
        <div class="row">
          <div class="label">
            <span>下载前询问保存位置</span>
            <small>关闭时直接保存到「下载」文件夹</small>
          </div>
          <input class="switch" type="checkbox" id="askWhereToSave" />
        </div>
      </div>
    </section>

    <section>
      <h2>账户与数据</h2>
      <div class="card">
        <div class="row">
          <div class="label">
            <span>清除网站数据</span>
            <small>删除 Cookie、缓存与本地存储，下次启动需要重新登录</small>
          </div>
          <button id="clear">清除…</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span class="status" id="status"></span>
    <button class="primary" id="done">完成</button>
  </footer>

  <script src="preferences.js"></script>
</body>
</html>
